orbit_frame   = ME             # latitude/longitude do arquivo de órbita: PA (MOON_PA) | ME (MOON_ME)
spice_dir     = D:/LINNA/spice/kernels
sldem_dir     = D:/LINNA/SLDEM512
polar_dir     = D:/LINNA/LOLA_POLAR_DEM
wac_643       = D:/LINNA/TIF_COLOR_HAPKE_643
wac_566       = D:/LINNA/TIF_COLOR_HAPKE_566
wac_415       = D:/LINNA/TIF_COLOR_HAPKE_415
kit_color     = assets/lroc_color_poles.tif
lola_dem      = assets/ldem_64.tif
hapke_dir     = assets/hapke
star_catalog  = D:/LINNA/STARS/hipparcos.bdb   # catálogo SPICE de estrelas (vazio = sem estrelas)
earth_texture = assets/earth_blue_marble_8192.tif   # NASA Blue Marble com nuvens

# CubeSat (vazio -> marcador). Frame da câmera: x = direita da imagem, y = topo, -z = eixo óptico
obj_file      = assets/cubsat/#SELENITA_16U_REV1.obj   # modelo em cm; lente na face +X
obj_scale     = 0.01              # unidade do OBJ -> metros
obj_rotation  = 0 90 0          # graus em X, Y, Z

# Tempo (UTC ISO; vazio -> início do arquivo) e velocidade inicial
start_utc     = 2029-01-16T19:09:42.000
speed         = 1

# Vista da órbita (ilustrativa)
orbit_fov     = 45             # vertical, graus
orbit_gain    = 4
orbit_star_mag = 6.5         # janela órbita: magnitude limite das estrelas visíveis (ilustrativo)
orbit_sat_scale = 1          # tamanho do satélite na janela órbita, em vezes o real (1 = real)

# Câmera do CubeSat
sensor        = 1024 1024
fov           = 60             # horizontal, graus
tilt          = 0              # fora do nadir, graus
azimuth       = 0              # direção do tilt: 0 = frente, 90 = direita
roll          = 0              # positivo gira a imagem no sentido horário
color         = natural       # natural (643/566/415 nm) | gray (643 nm), nas duas vistas
earthshine    = 1              # luz da Terra no lado noturno: 1 = sim, 0 = não
quality       = auto           # auto | high | medium | low (pela memória de vídeo, ver README)

# Capas polares do kit (>70°) em I/F: I/F = kit_gain*Ylin + kit_offset, bandas 643 566 415 nm
kit_gain      = 0.0647895 0.0570482 0.0394908
kit_offset    = 0.0259896 0.0228843 0.0158413

# Geração de imagens (botão GENERATE IMAGES; só aparece com o catálogo de crateras instalado)
crater_db       = assets/lunar_crater_database_robbins_2018.csv   # Robbins (2018)
images_end_utc  = 2029-01-16T19:19:42 # última linha da órbita a renderizar (vazio = início + 10 min)
crater_diameter = 5 30           # diâmetro mínimo e máximo das crateras anotadas, km
label_format    = circle         # conic (elipse da borda projetada) | circle (centro + raio + profundidade)
