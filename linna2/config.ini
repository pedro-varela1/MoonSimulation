# Gerador do dataset LINNA-2 (linna2.exe). Caminhos relativos à pasta do MoonSimulation.
# Valores padrão = specs LINNA-2 série B (C:\Users\pedropafvl\Downloads\LINNA-2_specs_B_data_generation\linna2\data).

# Dados (as mesmas chaves do config.ini do simulador)
spice_dir     = D:/LINNA/spice/kernels
sldem_dir     = D:/LINNA/SLDEM512
polar_dir     = D:/LINNA/LOLA_POLAR_DEM
wac_643       = D:/LINNA/TIF_COLOR_HAPKE_643
wac_566       = D:/LINNA/TIF_COLOR_HAPKE_566
wac_415       = D:/LINNA/TIF_COLOR_HAPKE_415
kit_color     = assets/lroc_color_poles.tif
lola_dem      = assets/ldem_64.tif
hapke_dir     = assets/hapke
earth_texture = assets/earth_blue_marble_8192.tif   # exigida pelo carregador; sem uso (earthshine desligado)
crater_db     = assets/lunar_crater_database_robbins_2018.csv
kit_gain      = 0.0647895 0.0570482 0.0394908
kit_offset    = 0.0259896 0.0228843 0.0158413

# Saída (catalog/ e splits/ ficam sempre em output_dir e servem também ao exemplo)
output_dir    = D:/LINNA/datasets/linna2
sample_dir    = D:/LINNA/datasets/linna2_sample
writer_threads = 3              # threads que codificam os PNG e gravam os JSON

# Câmera (01): pinhole quadrada, FOV = ângulo cheio na largura; render 1024², média 2×2 para 512²
render_res    = 1024
image_res     = 512
fov_classes   = 24 30 60 90     # graus (S1)
fov_jitter    = 0.1             # FOV = classe × U(1 - jitter, 1 + jitter)
tilt_max_deg  = 30
night_shortcut_deg = -7         # Sol abaixo disso em todo o footprint: imagem preta sem render
shadow_reach_km = 150           # terreno carregado em direção ao Sol, para sombras projetadas de fora do quadro
terrain_wait_limit_s = 300      # espera máxima pelo terreno de alta resolução (o frame sai mesmo assim, marcado no índice)

# S1: geometria aleatória (02)
s1_frames        = 150000 15000 15000   # train val test
s1_sample_frames = 300 50 50            # o exemplo (--sample): os primeiros frames de cada split
s1_seeds         = 11 12 13
s1_polar_share   = 0.2
s1_polar_lat_deg = 60
s1_altitude_km   = 15 200               # acima da superfície local (LOLA) no ponto subsatélite
s1_gsd_min_m     = 30
s1_limb_retries  = 20
s1_sun_shares    = 0.15 0.10 0.45 0.30  # noite, terminador, baixo, alto
s1_sun_edges_deg = -10 -3 3 15 45       # limites dos quatro estratos
s1_sun_cap_margin_deg = 1.54            # elevação ≤ 90 - |lat| + margem

# S2: órbitas STK em MOON_ME (03). Passos (s) por FOV: ⌊0,25·W/v_solo⌋ na altitude média (tabela do 01 §4)
orbits            = 30km 70km 150km
orbit_30km        = C:/Users/pedropafvl/Downloads/SelenITA_CoordinatesMoon_Operational_30km.txt
orbit_30km_fovs   = 60 90
orbit_30km_steps_s = 5 9
orbit_70km        = C:/Users/pedropafvl/Downloads/REPORT 26-02-2026 - COORDINATES MOON REFERENCE SCENARIO/SelenITA_CoordinatesMoon_Operational_70km.txt
orbit_70km_fovs   = 24 30 60 90
orbit_70km_steps_s = 4 6 12 22
orbit_150km       = C:/Users/pedropafvl/Downloads/REPORT 26-02-2026 - COORDINATES MOON REFERENCE SCENARIO/SelenITA_CoordinatesMoon_Commissioning.txt
orbit_150km_fovs  = 24 30 60 90
orbit_150km_steps_s = 10 13 29 50       # Commissioning (média 150,4 km) no lugar da de 100 km
s2_clips_per_epoch = 500
s2_clip_frames    = 48
s2_epochs         = 0 1 2 3 4 5         # Sol em et + k·mês sideral
sidereal_month_days = 27.321661
s2_guard_hours    = 1
s2_val_hours      = 24
s2_test_hours     = 72
s2_window_combos  = A0 A3 B0            # perfil (A nadir, B sorteado por revolução) + época
s2_clip_seed      = 21                  # + índice da órbita
s2_profile_b_seed = 31                  # + 100 × índice da órbita + índice da FOV
s2_sample_clips   = 1                   # exemplo: clips por FOV de cada órbita, na primeira época
s2_sample_window_hours = 2              # exemplo: horas do início da janela de teste

# Labels (04)
rim_samples      = 64
emission_max_deg = 60
d_eff_min_km     = 1.5
size_min_px      = 10       # 2·sqrt(a·b)
size_max_frac    = 0.4      # 2a ≤ fração × image_res
lit_pos          = 0.5
lit_bg           = 0.1
in_frame_min     = 0.5
lit_tau          = 0.01     # amostra acesa: máximo 3×3 do passo direto > lit_tau × percentil lit_percentile do frame
lit_percentile   = 99.5
dark_level       = 0.01     # dark: menos de dark_share dos pixels acima de dark_level do fundo de escala
dark_share       = 0.05
repro_seed       = 41
